<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duka Fresh — Support Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #142238;
    --panel: #1c2f4f;
    --panel-light: #24395e;
    --marigold: #f2a93b;
    --coral: #e8563e;
    --cream: #f6f1e6;
    --thread: #3a5077;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      repeating-linear-gradient(135deg, transparent 0 18px, rgba(242,169,59,0.05) 18px 20px),
      var(--ink);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .phone {
    width: 100%;
    max-width: 420px;
    height: 720px;
    background: var(--panel);
    border-radius: 28px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 1px var(--thread);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .header {
    background: linear-gradient(120deg, var(--coral), var(--marigold));
    padding: 20px 22px 16px;
    position: relative;
  }

  .header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 6px;
    background: repeating-linear-gradient(90deg,
      var(--ink) 0 10px, var(--marigold) 10px 20px, var(--coral) 20px 30px, var(--ink) 30px 40px);
  }

  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0 0 2px;
    color: var(--ink);
    letter-spacing: 0.2px;
  }

  .header p {
    margin: 0;
    font-size: 12.5px;
    color: rgba(20,34,56,0.75);
    font-weight: 500;
  }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2ecc71;
    margin-right: 6px;
    box-shadow: 0 0 0 3px rgba(46,204,113,0.25);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.45;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bot {
    align-self: flex-start;
    background: var(--panel-light);
    border-bottom-left-radius: 4px;
    color: var(--cream);
  }

  .user {
    align-self: flex-end;
    background: var(--marigold);
    color: var(--ink);
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }

  .meta {
    font-size: 10.5px;
    color: #8ba0c4;
    align-self: flex-start;
    padding-left: 4px;
    margin-top: -6px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--thread);
    background: var(--panel);
  }

  .input-row input {
    flex: 1;
    background: var(--panel-light);
    border: 1px solid var(--thread);
    border-radius: 20px;
    padding: 11px 16px;
    color: var(--cream);
    font-size: 14px;
    outline: none;
    font-family: 'Inter', sans-serif;
  }

  .input-row input::placeholder { color: #7f92b3; }

  .input-row button {
    background: var(--coral);
    color: var(--cream);
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .input-row button:hover { background: #d1442d; }
  .input-row button:active { transform: scale(0.96); }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--thread); border-radius: 4px; }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <h1>Duka Fresh</h1>
    <p><span class="status-dot"></span>Support Bot — usually replies instantly</p>
  </div>

  <div class="messages" id="messages">
    <div class="bubble bot">Hi there! Welcome to Duka Fresh 👋 How can I help you today? Ask about orders, delivery, payments, or returns.</div>
  </div>

  <div class="input-row">
    <input id="userInput" type="text" placeholder="Type a message… (English or Swahili)" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function addBubble(text, sender) {
    const div = document.createElement('div');
    div.className = 'bubble ' + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addBubble(text, 'user');
    inputEl.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      addBubble(data.answer, 'bot');
    } catch (err) {
      addBubble("Sorry, something went wrong reaching the server. Please try again.", 'bot');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
